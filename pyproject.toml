[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-state"
version = "0.1.0"
description = "Append-only, concurrency-safe todo board: event log plus deterministic fold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
todo-state = "todo_state.__main__:main"

[tool.setuptools]
packages = ["todo_state"]
